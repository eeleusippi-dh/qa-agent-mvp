name: Playwright MVP

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: playwright-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium y dependencias del sistema
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas
        run: npm run test:e2e

      - name: Guardar reporte y evidencias
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
